[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read-write", path = "./vectors.json" }]
remappings = ["v4-core/=lib/v4-core/", "forge-std/=lib/v4-core/lib/forge-std/src/", "solmate/=lib/v4-core/lib/solmate/", "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/"]
